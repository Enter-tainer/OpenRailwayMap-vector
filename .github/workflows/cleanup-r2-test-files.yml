name: cleanup-r2-test-files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install awscli
        run: pip install awscli

      - name: List bucket then delete test files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://6dce131cb6235fe4b77504d5101062f9.r2.cloudflarestorage.com
        run: |
          echo "=== Bucket listing before cleanup ==="
          aws s3 ls s3://orm/ --endpoint-url "$R2_ENDPOINT"
          echo "=== Deleting openrailwaymap-test-* files ==="
          aws s3 ls s3://orm/ --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | grep '^openrailwaymap-test-' \
            | xargs -r -I{} sh -c 'aws s3 rm "s3://orm/{}" --endpoint-url "$R2_ENDPOINT" --no-progress'
          echo "=== Bucket listing after cleanup ==="
          aws s3 ls s3://orm/ --endpoint-url "$R2_ENDPOINT"
